name: Check code

on:
  push:
    branches: [main, master, dev]

  pull_request:
    branches: [main, master, dev]

jobs:
  check-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install hatch
        run: pip install -U hatch

      - name: Run linter
        run: hatch run lint:all

      - name: Run tests
        run: hatch run test:test

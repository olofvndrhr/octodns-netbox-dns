[project]
name = "octodns-netbox-dns"
description = "octodns netbox-dns provider"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Jeffrey C. Ollie", email = "jeff@ocjtech.us" },
  { name = "Ivan Schaller", email = "ivan@schaller.sh" },
]
keywords = []
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "dnspython>=2.7.0",
  "pynetbox>=7.5.0",
]
dynamic = ["version"]

[project.urls]
History = "https://github.com/olofvndrhr/octodns-netbox-dns/commits/master"
Homepage = "https://github.com/olofvndrhr/octodns-netbox-dns"
Source = "https://github.com/olofvndrhr/octodns-netbox-dns"
Tracker = "https://github.com/olofvndrhr/octodns-netbox-dns/issues"

[build-system]
requires = [
  "hatch-regex-commit==0.0.3",
  "hatchling==1.27.0",
]
build-backend = "hatchling.build"

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
executionEnvironments = [
  { root = "tests", reportMissingImports = false },
]

[tool.hatch.version]
source = "regex_commit"
path = "src/octodns_netbox_dns/__about__.py"
tag_sign = false

[tool.hatch.build.targets.sdist]
packages = ["src/octodns_netbox_dns"]

[tool.hatch.build.targets.wheel]
packages = ["src/octodns_netbox_dns"]

[tool.hatch.envs.test]
dependencies = [
  "pytest==9.0.2",
  "coverage==7.13.2",
  "octodns~=1.22.0",
  "octodns-spf==1.0.0",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.test.scripts]
test = "pytest {args:tests}"
sync = [
  "cd dev && octodns-sync --debug --force --config-file {args}",
]
dump = [
  "cd dev && octodns-dump --debug --config-file {args} --output-dir output '*' netbox",
]
validate = [
  "cd dev && octodns-validate --debug --config-file {args}",
]

[tool.hatch.envs.lint]
python = "3.11"
dependencies = [
  "ruff==0.15.20",
  "basedpyright==1.39.9",
  "octodns~=1.21.0",
]

[tool.hatch.envs.lint.scripts]
typing = "basedpyright {args:src tests}"
style = [
  "ruff check --no-fix {args:src tests}",
  "ruff format --diff {args:src tests}",
]
all = ["style", "typing"]
fmt = [
  "ruff check --fix {args:src tests}",
  "ruff format {args:src tests}",
  "style",
]

[tool.pytest.ini_options]
addopts = "--color=yes --exitfirst --verbose --strict-config --strict-markers"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
show-fixes = true

[tool.ruff.lint]
ignore = [
  "BLE001",  # blind-except
]
unfixable = ["F401"]  # unused-import

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]  # undocumented-public-package
"__about__.py" = [
  "D104",  # undocumented-public-package
  "F841"  # unused-variable
]
"tests/**/*" = [
  "PLR2004",  # magic-value-comparison
  "S101",  # assert
]
"**.ipynb" = ["T201", "T203"]  # print/pprint

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true
